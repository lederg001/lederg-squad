 ? '<h3>БЫСТРЫЙ СТАРТ · WINDOWS</h3><ol><li>Скачай ZIP-архив и распакуй его полностью в отдельную папку, например C:\\Tools\\zapret.</li><li>Открой README внутри распакованной папки и прочитай требования и описание BAT-файлов.</li><li>Для первичной проверки запусти предусмотренный автором тест стратегий (Run Tests), затем выбери подходящий вариант.</li><li>Если выбранный BAT-файл требует права администратора, запускай его осознанно от имени администратора.</li><li>После проверки протестируй нужные сайты и игры. Если соединение стало хуже — останови службу/скрипт штатным способом из комплекта.</li></ol><h3>ДИАГНОСТИКА И УСТРАНЕНИЕ ПРОБЛЕМ</h3><ul><li>Не запускай несколько разных DPI-обходчиков одновременно: они могут конфликтовать за сетевые фильтры.</li><li>Если интернет пропал, останови активный сценарий zapret и проверь, восстановилось ли обычное подключение.</li><li>Не скачивай отдельные WinDivert DLL из случайных сайтов и не отключай антивирус по просьбе неизвестных инструкций.</li></ul>'

 app.innerHTML='<section class="detail"><div class="backline"><a href="#/">LEDERG SQUAD</a> / ДОКУМЕНТАЦИЯ / '+esc(t.name)+'</div><div class="detail-hero"><div><div class="section-kicker">'+esc(t.category)+' / BY '+esc(t.author)+'</div><h1>'+esc(t.name)+'</h1><p>'+esc(t.summary)+'</p><div class="pills">'+t.tags.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'</div></div><div class="detail-stats"><span>Последняя версия</span><b data-detail-version="'+esc(t.id)+'">'+esc(t.version)+'</b><span style="margin-top:8px">Проверено по релизам</span><b data-release-date="'+esc(t.id)+'">'+esc(t.published)+'</b></div></div><div class="detail-columns"><div><article class="panel"><h2>Как работает программа</h2><p>'+esc(t.summary)+'</p><h3>ВОЗМОЖНОСТИ</h3><ul>'+t.features.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></article><article class="panel"><h2>Документация и установка</h2>'+docs+'</article><article class="panel"><h2>Прямые загрузки</h2><p>Файлы берутся из опубликованных релизов проекта. Кнопка начинает загрузку выбранной сборки напрямую.</p><div class="file-list">'+fileRows+'</div></article><article class="panel"><h2>Безопасность и примечания</h2><ul>'+t.notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p>LEDERG SQUAD не изменяет и не перепаковывает файлы. Проверяй подпись, хеш (если опубликован) и скачанный файл перед установкой.</p></article></div><aside class="detail-aside"><article class="panel"><h2>Быстрые разделы</h2><a class="source-link" href="#/">Вернуться в каталог <span>←</span></a><a class="source-link" href="#safety">Проверка загрузки <span>↓</span></a><div class="official-note">Версии и прямые ссылки обновляются автоматически по новым релизам. Если API временно недоступен, остаётся последняя сохранённая версия.</div></article></aside></div></section>';

function warpView(){
 const rows=WARP_DOWNLOADS.map(d=>'<div class="file-row"><div><strong>'+d.label+'</strong><small>'+d.note+'</small></div><a href="'+d.url+'" target="_blank" rel="noopener noreferrer">СКАЧАТЬ / УСТАНОВИТЬ ↓</a></div>').join('');
 app.innerHTML='<section class="detail"><div class="backline"><a href="#/">LEDERG SQUAD</a> / ДОКУМЕНТАЦИЯ / CLOUDFLARE WARP</div><div class="detail-hero"><div><div class="section-kicker">05 / CLOUDFLARE · ALL PLATFORMS</div><h1>CLOUDFLARE WARP</h1><p>LEDERG SQUAD собирает варианты установки потребительского клиента Cloudflare WARP для Windows, macOS, Linux, Android и iOS. Выбирай свою платформу ниже: ссылки ведут напрямую к официальному установщику, репозиторию пакетов или магазину приложений.</p></div><div class="detail-stats"><span>Поддерживаемые платформы</span><b>5 / 5</b><span style="margin-top:8px">Источник пакетов</span><b>Cloudflare</b></div></div><div class="detail-columns"><div><article class="panel"><h2>Предпросмотр приложения</h2><img src="./assets/warp-preview.svg" alt="Иллюстративный предпросмотр клиента Cloudflare WARP" style="width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:#0b0b0d"></article><article class="panel"><h2>Что такое WARP</h2><p>Cloudflare WARP — клиент для защищённого подключения через сеть Cloudflare. В режиме WARP трафик устройства отправляется через WARP-туннель; в режиме 1.1.1.1 шифруются DNS-запросы к резолверу Cloudflare. Это не обещание полной анонимности и не гарантия обхода каждой сетевой блокировки.</p><h3>ВАЖНО О ВАРИАНТАХ</h3><ul><li><b>Windows:</b> MSI-установщик для поддерживаемых версий Windows и x64 / ARM64.</li><li><b>macOS:</b> PKG-установщик для поддерживаемых версий macOS.</li><li><b>Linux:</b> официальный репозиторий Cloudflare; выбери DEB/RPM-пакет по своему дистрибутиву.</li><li><b>Android:</b> приложение 1.1.1.1 + WARP устанавливается из Google Play.</li><li><b>iOS:</b> приложение 1.1.1.1 устанавливается из App Store.</li></ul></article><article class="panel"><h2>Кнопки загрузки по платформам</h2><div class="file-list">'+rows+'</div><p>Android и iOS не предлагают обычный APK/IPA файл на странице Cloudflare для потребителей: установка идёт через официальные магазины приложений. Linux распространяется через репозиторий пакетов, поскольку файл зависит от дистрибутива.</p></article><article class="panel"><h2>Установка и первый запуск</h2><ol><li>Выбери платформу и нажми соответствующую кнопку загрузки или установки.</li><li>Для Windows и macOS открой скачанный установщик и заверши мастер.</li><li>Для Linux добавь официальный репозиторий Cloudflare и установи пакет для своего дистрибутива.</li><li>На Android и iOS открой карточку приложения в магазине и установи его.</li><li>Запусти приложение и выбери режим WARP или 1.1.1.1, исходя из того, что именно требуется.</li></ol></article></div><aside class="detail-aside"><article class="panel"><h2>Быстрый выбор</h2>'+WARP_DOWNLOADS.map(d=>'<a class="source-link" href="'+d.url+'" target="_blank" rel="noopener noreferrer">'+d.label+' <span>↓</span></a>').join('')+'<div class="official-note">Ссылки на настольные установщики и мобильные приложения принадлежат инфраструктуре Cloudflare и официальным магазинам. Сторонние зеркала здесь не используются.</div></article></aside></div></section>';
}
function render(){
 if(location.hash==='#catalog'){homeView();$('#catalog')?.scrollIntoView({behavior:'smooth'});return;}
 const parts=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
 if(!parts.length||parts[0]==='catalog')homeView();
 else if(parts[0]==='warp')warpView();
 else if(parts[0]==='tool'){const t=tools.find(x=>x.id===parts[1]);t?detailView(t):homeView();}
 else homeView();
 nav.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===(parts[0]==='warp'?'#/warp':parts[0]==='tool'?'#/tool/'+parts[1]:'#/')));
 nav.classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});
}
async function refreshReleases(){
 const apply=(t,r)=>{
  if(!r)return;
  t.version=r.version||r.tag_name||t.version;
  t.published=(r.published||r.published_at||t.published||'').slice(0,10);
  if(Array.isArray(r.assets)&&r.assets.length){
   t.assets=r.assets.map(a=>({name:a.name,label:a.label||a.name,os:a.os||'',url:a.url||a.browser_download_url,key:a.key||'',size:a.size||0})).filter(a=>a.url);
   t.primary=t.assets.find(a=>['zip','win64','universal'].includes(a.key))?.name||t.assets[0]?.name;
  }
 };
 try{
  const manifest=await fetch('./releases.json?'+Date.now(),{cache:'no-store'});
  if(manifest.ok){const data=await manifest.json();for(const t of tools)apply(t,data.projects?.[t.id]);}
 }catch(e){/* use baked-in last-known release metadata */}
 await Promise.all(tools.map(async t=>{
  try{
   const res=await fetch('https://api.github.com/repos/'+t.repo+'/releases/latest',{headers:{Accept:'application/vnd.github+json'}});
   if(!res.ok)throw new Error('GitHub API '+res.status);
   const release=await res.json();if(!release||!Array.isArray(release.assets))return;
   const mapped=release.assets.map(a=>normaliseAsset(t.id,a)).filter(a=>a.url);
   apply(t,{version:release.tag_name,published:release.published_at,assets:mapped});
  }catch(e){/* last successful scheduled manifest and baked-in fallback stay available */}
 }));
 const y=window.scrollY;
 if((location.hash||'#/')==='#/'||(location.hash||'#/')==='#/catalog')homeView();
 const current=tools.find(t=>location.hash==='#/tool/'+t.id);if(current)detailView(current);
 window.scrollTo({top:y,behavior:'instant'});
}
$('#mobileMenu').addEventListener('click',()=>nav.classList.toggle('open'));
nav.addEventListener('click',e=>{if(e.target.closest('a'))nav.classList.remove('open');});
window.addEventListener('hashchange',render);
$('#year').textContent=new Date().getFullYear();
render();
refreshReleases();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
