name: Monitor official releases

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-monitor
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Refresh official release manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_releases.py
      - name: Validate release manifest
        run: |
          python - <<'PY'
          import json
          data=json.load(open("releases.json", encoding="utf-8"))
          required={"zapret","byebye","tgproxy","tgproxyandroid"}
          assert required.issubset(data["projects"]), data["projects"].keys()
          for key in required:
              assert data["projects"][key]["assets"], key
              assert all(a["url"].startswith("https://") for a in data["projects"][key]["assets"])
          warp_platforms={item["os"] for item in data["warp"]["downloads"]}
          assert {"Windows","macOS","Linux","Android","iOS"}.issubset(warp_platforms)
          assert data["warp"]["download"].startswith("https://downloads.cloudflareclient.com/")
          PY
      - name: Commit manifest when changed
        id: commit
        run: |
          if git diff --quiet -- releases.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git commit -m "chore: refresh official release manifest"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy updated release manifest
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
